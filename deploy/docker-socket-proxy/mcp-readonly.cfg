global
    log stdout format raw local0

defaults
    log global
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend docker_api
    bind :2375
    acl safe_method method GET HEAD
    acl safe_path path_reg -i ^(/v[0-9.]+)?/(containers|images|info|volumes|_ping|version)(/.*)?$
    http-request deny deny_status 403 unless safe_method safe_path
    default_backend docker_socket

backend docker_socket
    server docker /var/run/docker.sock
