  TelemetryRetention__HitsRetentionDays: ${TELEMETRY_RETENTION_HITS_DAYS:-3}
  TelemetryRetention__EventsRetentionDays: ${TELEMETRY_RETENTION_EVENTS_DAYS:-7}
  TelemetryRetention__SummaryRetentionDays: ${TELEMETRY_RETENTION_SUMMARY_DAYS:-30}
