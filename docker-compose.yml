  ChatGptGateway__OAuth__Authority: ${CHATGPT_GATEWAY_OAUTH_AUTHORITY:-}
  ChatGptGateway__OAuth__ClientId: ${CHATGPT_GATEWAY_OAUTH_CLIENT_ID:-}
  ChatGptGateway__OAuth__ClientSecret: ${CHATGPT_GATEWAY_OAUTH_CLIENT_SECRET:-}
  ChatGptGateway__OAuth__Scopes__0: ${CHATGPT_GATEWAY_OAUTH_SCOPE_0:-openid}
  ChatGptGateway__OAuth__Scopes__1: ${CHATGPT_GATEWAY_OAUTH_SCOPE_1:-profile}
  ChatGptGateway__OAuth__Scopes__2: ${CHATGPT_GATEWAY_OAUTH_SCOPE_2:-email}
  ChatGptGateway__OAuth__Scopes__3: ${CHATGPT_GATEWAY_OAUTH_SCOPE_3:-offline_access}
  ChatGptGateway__OAuth__Scopes__4: governance:scheduled
  ChatGptGateway__OAuth__TestMode: ${CHATGPT_GATEWAY_OAUTH_TEST_MODE:-false}
  ChatGptGateway__OAuth__TestBearerToken: ${CHATGPT_GATEWAY_OAUTH_TEST_BEARER_TOKEN:-}
  ChatGptGateway__OAuth__SelfHosted: ${CHATGPT_GATEWAY_OAUTH_SELF_HOSTED:-false}
  ChatGptGateway__OAuth__SelfHostedIssuer: ${CHATGPT_GATEWAY_OAUTH_SELF_HOSTED_ISSUER:-}
  ChatGptGateway__OAuth__SelfHostedSigningKey: ${CHATGPT_GATEWAY_OAUTH_SELF_HOSTED_SIGNING_KEY:-}
  ChatGptGateway__OAuth__SelfHostedRsaPrivateKey: ${CHATGPT_GATEWAY_OAUTH_RSA_PRIVATE_KEY:-}
  ChatGptGateway__OAuth__ScheduledGovernanceResource: ${CHATGPT_GATEWAY_OAUTH_SCHEDULED_GOVERNANCE_RESOURCE:-${AUTOMATION_GATEWAY_PUBLIC_MCP_URL:-https://context-hub.example.com/mcp-automation}}
  ChatGptGateway__OAuth__IncludeIssuerInAuthorizationResponse: ${CHATGPT_GATEWAY_OAUTH_INCLUDE_ISSUER_IN_AUTHORIZATION_RESPONSE:-true}
  ChatGptGateway__OAuth__ClientIdMetadataDocumentEnabled: ${CHATGPT_GATEWAY_OAUTH_CLIENT_ID_METADATA_DOCUMENT_ENABLED:-true}
  ChatGptGateway__OAuth__ClientIdMetadataFetchTimeoutSeconds: ${CHATGPT_GATEWAY_OAUTH_CLIENT_ID_METADATA_FETCH_TIMEOUT_SECONDS:-5}
  ChatGptGateway__OAuth__ClientIdMetadataMaxRedirects: ${CHATGPT_GATEWAY_OAUTH_CLIENT_ID_METADATA_MAX_REDIRECTS:-3}
  ChatGptGateway__OAuth__ClientIdMetadataMaxResponseBytes: ${CHATGPT_GATEWAY_OAUTH_CLIENT_ID_METADATA_MAX_RESPONSE_BYTES:-65536}
  ChatGptGateway__OAuth__AllowedRedirectUriPrefixes__0: ${CHATGPT_GATEWAY_OAUTH_ALLOWED_REDIRECT_URI_PREFIX_0:-https://chatgpt.com/}
  ChatGptGateway__OAuth__AllowedRedirectUriPrefixes__1: ${CHATGPT_GATEWAY_OAUTH_ALLOWED_REDIRECT_URI_PREFIX_1:-https://chat.openai.com/}
  ChatGptGateway__ContextHub__BaseUrl: http://mcp-server:8080
  ChatGptGateway__ContextHub__ServiceToken: ${CONTEXTHUB_SECURITY_BOOTSTRAP_TOKEN}
  ChatGptGateway__PublicMcpUrl: ${CHATGPT_GATEWAY_PUBLIC_MCP_URL:-}
  ChatGptGateway__PublicResourceMetadataUrl: ${CHATGPT_GATEWAY_PUBLIC_RESOURCE_METADATA_URL:-}

x-project-artifact-object-storage-config: &project-artifact-object-storage-config
  ProjectArtifacts__ObjectStorage__Enabled: ${PROJECT_ARTIFACT_OBJECT_STORAGE_ENABLED:-false}
  ProjectArtifacts__ObjectStorage__Provider: ${PROJECT_ARTIFACT_OBJECT_STORAGE_PROVIDER:-r2}
  ProjectArtifacts__ObjectStorage__Endpoint: ${PROJECT_ARTIFACT_OBJECT_STORAGE_ENDPOINT:-}
  ProjectArtifacts__ObjectStorage__AccessKeyId: ${PROJECT_ARTIFACT_OBJECT_STORAGE_ACCESS_KEY_ID:-}
  ProjectArtifacts__ObjectStorage__SecretAccessKey: ${PROJECT_ARTIFACT_OBJECT_STORAGE_SECRET_ACCESS_KEY:-}
  ProjectArtifacts__ObjectStorage__Bucket: ${PROJECT_ARTIFACT_OBJECT_STORAGE_BUCKET:-}
  ProjectArtifacts__ObjectStorage__Region: ${PROJECT_ARTIFACT_OBJECT_STORAGE_REGION:-auto}
  ProjectArtifacts__ObjectStorage__PublicBaseUrl: ${PROJECT_ARTIFACT_OBJECT_STORAGE_PUBLIC_BASE_URL:-}
  ProjectArtifacts__ObjectStorage__MaxObjectBytes: ${PROJECT_ARTIFACT_OBJECT_STORAGE_MAX_OBJECT_BYTES:-10485760}

services:
  mcp-docker-proxy:
    image: contexthub-docker-socket-proxy:latest
    build:
      context: deploy/docker-socket-proxy
      dockerfile: Dockerfile
    command: ["-f", "/usr/local/etc/haproxy/custom.cfg"]
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deploy/docker-socket-proxy/mcp-readonly.cfg:/usr/local/etc/haproxy/custom.cfg:ro
    networks:
      - mcp-docker-api
    read_only: true
    tmpfs:
      - /run
      - /tmp
      - /var/lib/haproxy
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  dashboard-docker-proxy:
    image: contexthub-docker-socket-proxy:latest
    build:
      context: deploy/docker-socket-proxy
      dockerfile: Dockerfile
    command: ["-f", "/usr/local/etc/haproxy/custom.cfg"]
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deploy/docker-socket-proxy/dashboard.cfg:/usr/local/etc/haproxy/custom.cfg:ro
    networks:
      - dashboard-docker-api
    read_only: true
    tmpfs:
      - /run
      - /tmp
      - /var/lib/haproxy
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  embedding-service:
    image: contexthub-embedding-service:latest
    build:
      context: .
      dockerfile: src/Memory.EmbeddingServer/Dockerfile
      args:
        APP_VERSION: ${CONTEXTHUB_BUILD_VERSION:-1.1.0}
        BUILD_TIMESTAMP_UTC: ${CONTEXTHUB_BUILD_TIMESTAMP_UTC:-}
    restart: always
    environment:
      <<: *embedding-config
      ASPNETCORE_URLS: http://0.0.0.0:8081
    volumes:
      - embedding-model-cache:/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: contexthub-postgres:latest
    build:
      context: deploy/postgres
      dockerfile: Dockerfile
    restart: always
    environment:
      POSTGRES_DB: contexthub
      POSTGRES_USER: contexthub
      POSTGRES_PASSWORD: contexthub
    ports:
      - "${POSTGRES_HOST_BIND:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contexthub -d contexthub"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.4-alpine
    restart: always
    ports:
      - "${REDIS_HOST_BIND:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "no", "--save", "3600", "1", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mcp-server:
    image: contexthub-mcp-server:latest
    build:
      context: .
      dockerfile: src/Memory.McpServer/Dockerfile
      args:
        APP_VERSION: ${CONTEXTHUB_BUILD_VERSION:-1.1.0}
        BUILD_TIMESTAMP_UTC: ${CONTEXTHUB_BUILD_TIMESTAMP_UTC:-}
    restart: always
    environment:
      ContextHub__InstanceId: ${CONTEXT_HUB_INSTANCE_ID:-default}
      ContextHub__SecretKey: ${CONTEXTHUB_SECRET_KEY:-${DASHBOARD_SECRET_KEY:-}}
      ContextHub__Security__RequireAuthentication: ${CONTEXTHUB_SECURITY_REQUIREAUTHENTICATION:-true}
      CONTEXTHUB_SECURITY_BOOTSTRAP_TOKEN: ${CONTEXTHUB_SECURITY_BOOTSTRAP_TOKEN}
      ContextHub__Security__BootstrapToken: ${CONTEXTHUB_SECURITY_BOOTSTRAP_TOKEN}
      ContextHub__Security__BootstrapTenantSlug: ${CONTEXTHUB_SECURITY_BOOTSTRAP_TENANT_SLUG:-context-team}
      ContextHub__Security__BootstrapUsername: ${CONTEXTHUB_SECURITY_BOOTSTRAP_USERNAME:-dashboard-service}
      ContextHub__Security__BootstrapAllowedProjectIds: ${CONTEXTHUB_SECURITY_BOOTSTRAP_ALLOWED_PROJECT_IDS:-ContextHub}
      ContextHub__Security__AllowedMcpOrigins__0: ${CONTEXTHUB_ALLOWED_MCP_ORIGIN:-}
      ForwardedHeaders__KnownNetworks__0: ${TRUSTED_PROXY_NETWORK:-}
      <<: [*embedding-config, *telemetry-retention-config, *project-artifact-object-storage-config]
      Embeddings__Provider: Http
      Embeddings__BaseUrl: http://embedding-service:8081
      Dashboard__ComposeProject: ${DASHBOARD_COMPOSE_PROJECT:-contexthub}
      Dashboard__DockerEndpoint: http://mcp-docker-proxy:2375
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=contexthub;Username=contexthub;Password=contexthub
      ConnectionStrings__Redis: redis:6379
      Memory__Namespace: contexthub
      DatabaseLogging__MinimumLevel: Warning
    depends_on:
      embedding-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-docker-proxy:
        condition: service_started
    ports:
      - "${MCP_SERVER_HOST_BIND:-127.0.0.1}:${MCP_SERVER_HOST_PORT:-8092}:8080"
    networks:
      - default
      - mcp-docker-api
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"Authorization: Bearer $$CONTEXTHUB_SECURITY_BOOTSTRAP_TOKEN\" http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  chatgpt-gateway:
    image: contexthub-chatgpt-gateway:latest
    build:
      context: .
      dockerfile: src/Memory.ChatGptGateway/Dockerfile
      args:
        APP_VERSION: ${CONTEXTHUB_BUILD_VERSION:-1.1.0}
        BUILD_TIMESTAMP_UTC: ${CONTEXTHUB_BUILD_TIMESTAMP_UTC:-}
    restart: always
    environment:
      ContextHub__InstanceId: ${CONTEXT_HUB_INSTANCE_ID:-default}
      ContextHub__SecretKey: ${CONTEXTHUB_SECRET_KEY:-${DASHBOARD_SECRET_KEY:-}}
      ContextHub__Security__BootstrapTenantSlug: ${CONTEXTHUB_SECURITY_BOOTSTRAP_TENANT_SLUG:-context-team}
      ContextHub__Security__BootstrapUsername: ${CONTEXTHUB_SECURITY_BOOTSTRAP_USERNAME:-dashboard-service}
      <<: [*embedding-config, *telemetry-retention-config, *chatgpt-gateway-config, *project-artifact-object-storage-config]
      ChatGptGateway__AllowedMcpOrigins__0: ${CHATGPT_GATEWAY_ALLOWED_MCP_ORIGIN:-}
      ForwardedHeaders__KnownNetworks__0: ${TRUSTED_PROXY_NETWORK:-}
      Embeddings__Provider: Http
      Embeddings__BaseUrl: http://embedding-service:8081
      ASPNETCORE_URLS: http://0.0.0.0:8083
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=contexthub;Username=contexthub;Password=contexthub
      ConnectionStrings__Redis: redis:6379
      Memory__Namespace: contexthub
      DatabaseLogging__MinimumLevel: Warning
    depends_on:
      mcp-server:
        condition: service_healthy
    ports:
      - "${CHATGPT_GATEWAY_HOST_BIND:-127.0.0.1}:${CHATGPT_GATEWAY_HOST_PORT:-8094}:8083"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/health/ready"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  automation-gateway:
    image: contexthub-chatgpt-gateway:latest
    build:
      context: .
      dockerfile: src/Memory.ChatGptGateway/Dockerfile
      args:
        APP_VERSION: ${CONTEXTHUB_BUILD_VERSION:-1.1.0}
        BUILD_TIMESTAMP_UTC: ${CONTEXTHUB_BUILD_TIMESTAMP_UTC:-}
    restart: always
    environment:
      ContextHub__InstanceId: ${CONTEXT_HUB_INSTANCE_ID:-default}
      ContextHub__SecretKey: ${CONTEXTHUB_SECRET_KEY:-${DASHBOARD_SECRET_KEY:-}}
      ContextHub__Security__BootstrapTenantSlug: ${CONTEXTHUB_SECURITY_BOOTSTRAP_TENANT_SLUG:-context-team}
      ContextHub__Security__BootstrapUsername: ${CONTEXTHUB_SECURITY_BOOTSTRAP_USERNAME:-dashboard-service}
      <<: [*embedding-config, *telemetry-retention-config, *chatgpt-gateway-config, *project-artifact-object-storage-config]
      ChatGptGateway__Surface: Automation
      ChatGptGateway__PublicMcpUrl: ${AUTOMATION_GATEWAY_PUBLIC_MCP_URL:-https://context-hub.example.com/mcp-automation}
      ChatGptGateway__PublicResourceMetadataUrl: ${AUTOMATION_GATEWAY_PUBLIC_RESOURCE_METADATA_URL:-https://context-hub.example.com/.well-known/oauth-protected-resource/mcp-automation}
      ChatGptGateway__AllowedMcpOrigins__0: ${CHATGPT_GATEWAY_ALLOWED_MCP_ORIGIN:-}
      ForwardedHeaders__KnownNetworks__0: ${TRUSTED_PROXY_NETWORK:-}
      Embeddings__Provider: Http
      Embeddings__BaseUrl: http://embedding-service:8081
      ASPNETCORE_URLS: http://0.0.0.0:8083
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=contexthub;Username=contexthub;Password=contexthub
      ConnectionStrings__Redis: redis:6379
      Memory__Namespace: contexthub
      DatabaseLogging__MinimumLevel: Warning
    depends_on:
      mcp-server:
        condition: service_healthy
    ports:
      - "${AUTOMATION_GATEWAY_HOST_BIND:-127.0.0.1}:${AUTOMATION_GATEWAY_HOST_PORT:-8095}:8083"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/health/ready"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    image: contexthub-worker:latest
    build:
      context: .
      dockerfile: src/Memory.Worker/Dockerfile
      args:
        APP_VERSION: ${CONTEXTHUB_BUILD_VERSION:-1.1.0}
        BUILD_TIMESTAMP_UTC: ${CONTEXTHUB_BUILD_TIMESTAMP_UTC:-}
    restart: always
    environment:
      ContextHub__InstanceId: ${CONTEXT_HUB_INSTANCE_ID:-default}
      ContextHub__SecretKey: ${CONTEXTHUB_SECRET_KEY:-${DASHBOARD_SECRET_KEY:-}}
      <<: [*embedding-config, *telemetry-retention-config, *project-artifact-object-storage-config]
      ASPNETCORE_URLS: http://0.0.0.0:8082
      Embeddings__Provider: Http
      Embeddings__BaseUrl: http://embedding-service:8081
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=contexthub;Username=contexthub;Password=contexthub
      ConnectionStrings__Redis: redis:6379
      Memory__Namespace: contexthub
      DatabaseLogging__MinimumLevel: Warning
    depends_on:
      embedding-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  dashboard:
    image: contexthub-dashboard:latest
    build:
      context: .
      dockerfile: src/Memory.Dashboard/Dockerfile
      args:
        APP_VERSION: ${CONTEXTHUB_BUILD_VERSION:-1.1.0}
        BUILD_TIMESTAMP_UTC: ${CONTEXTHUB_BUILD_TIMESTAMP_UTC:-}
    restart: always
    environment:
      ContextHub__InstanceId: ${CONTEXT_HUB_INSTANCE_ID:-default}
      <<: *dashboard-config
      ForwardedHeaders__KnownNetworks__0: ${TRUSTED_PROXY_NETWORK:-}
      ASPNETCORE_URLS: http://0.0.0.0:8088
      Dashboard__BaseUrl: http://mcp-server:8080
      Dashboard__DockerEndpoint: http://dashboard-docker-proxy:2375
      Dashboard__DataProtectionPath: /var/lib/contexthub-dashboard/keys
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=contexthub;Username=contexthub;Password=contexthub
      Memory__Namespace: contexthub
    depends_on:
      mcp-server:
        condition: service_healthy
      dashboard-docker-proxy:
        condition: service_started
    ports:
      - "${DASHBOARD_HOST_BIND:-127.0.0.1}:${DASHBOARD_HOST_PORT:-8091}:8088"
    volumes:
      - dashboard-data-protection:/var/lib/contexthub-dashboard/keys
    networks:
      - default
      - dashboard-docker-api
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"Authorization: Bearer $$Dashboard__ApiToken\" http://localhost:8088/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
  redis-data:
  embedding-model-cache:
  dashboard-data-protection:

networks:
  mcp-docker-api:
    internal: true
  dashboard-docker-api:
    internal: true
