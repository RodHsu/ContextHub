<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">ContextHub RWD, Loading, Refresh and Motion Validation</title>
  <desc id="desc">Product Design and Stitch summary board for responsive, loading, refresh and motion validation.</desc>
  <style>.bg{fill:#0c1322}.panel{fill:#151c28;stroke:#2a3545}.sub{fill:#1b2432;stroke:#2a3545}.txt{fill:#f8fafc;font-family:Inter,Segoe UI,Arial,sans-serif}.muted{fill:#9aa7b8;font-family:Inter,Segoe UI,Arial,sans-serif}.h1{font-size:34px;font-weight:700}.h2{font-size:21px;font-weight:650}.body{font-size:16px}.blue{fill:#0b63ce}.green{fill:#0e9f6e}.amber{fill:#b7791f}</style>
  <rect class="bg" width="1440" height="960"/><rect x="48" y="44" width="1344" height="112" rx="8" class="panel"/>
  <text x="76" y="92" class="txt h1">RWD, Loading, Refresh and Motion Validation</text><text x="76" y="128" class="muted body">Stitch: projects/4533056430393435785/screens/17e2fea5a4b347b9bbd3a8e485b73fe1</text>
  <rect x="76" y="202" width="390" height="240" rx="8" class="panel"/><text x="108" y="246" class="txt h2">Breakpoint Matrix</text><text x="108" y="292" class="muted body">1920, 1366, 1280, 1024, 800, 768, 390</text><text x="108" y="334" class="muted body">Desktop expanded; tablet icon rail; mobile drawer</text>
  <rect x="524" y="202" width="390" height="240" rx="8" class="panel"/><text x="556" y="246" class="txt h2">Scroll Ownership</text><text x="556" y="292" class="muted body">Content vertical; body no horizontal scroll</text><text x="556" y="334" class="muted body">Tables, code and diffs own local horizontal scroll</text>
  <rect x="972" y="202" width="390" height="240" rx="8" class="panel"/><text x="1004" y="246" class="txt h2">Visual QA</text><text x="1004" y="292" class="muted body">No panel overlap, no clipping, sticky headers intact</text><text x="1004" y="334" class="muted body">Command palette, modal, toast, tooltip checked</text>
  <rect x="76" y="516" width="612" height="250" rx="8" class="panel"/><text x="108" y="560" class="txt h2">Loading and Refresh</text><rect x="108" y="596" width="420" height="12" rx="6" class="sub"/><rect x="108" y="596" width="180" height="12" rx="6" class="blue"/><text x="108" y="646" class="muted body">App progress, panel/table/code skeleton, stale banner, paused refresh, retry flow</text>
  <rect x="748" y="516" width="612" height="250" rx="8" class="panel"/><text x="780" y="560" class="txt h2">Motion and Reduced Motion</text><circle cx="790" cy="610" r="6" class="green"/><text x="808" y="616" class="muted body">120/180/220/240ms tokens</text><circle cx="790" cy="652" r="6" class="amber"/><text x="808" y="658" class="muted body">Reduced motion fades or snaps instead of sliding</text>
