<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">ContextHub Review, Governance and Evaluation Workbench</title>
  <desc id="desc">Product Design and Stitch summary board for ChatGPT proposals, governance and evaluation routes.</desc>
  <style>.bg{fill:#0c1322}.panel{fill:#151c28;stroke:#2a3545}.sub{fill:#1b2432;stroke:#2a3545}.txt{fill:#f8fafc;font-family:Inter,Segoe UI,Arial,sans-serif}.muted{fill:#9aa7b8;font-family:Inter,Segoe UI,Arial,sans-serif}.h1{font-size:34px;font-weight:700}.h2{font-size:21px;font-weight:650}.body{font-size:16px}.amber{fill:#b7791f}.green{fill:#0e9f6e}.red{fill:#c81e1e}.blue{fill:#0b63ce}</style>
  <rect class="bg" width="1440" height="960"/><rect x="48" y="44" width="1344" height="112" rx="8" class="panel"/>
  <text x="76" y="92" class="txt h1">Review, Governance and Evaluation Workbench</text><text x="76" y="128" class="muted body">Stitch: projects/4533056430393435785/screens/8b98c7ea4f0645b2b8da732e7c6fa89a</text>
  <rect x="70" y="210" width="330" height="510" rx="8" class="panel"/><text x="104" y="254" class="txt h2">Proposal Queue</text><circle cx="108" cy="304" r="6" class="amber"/><text x="128" y="310" class="muted body">Pending, validating, stale, blocked</text><circle cx="108" cy="346" r="6" class="green"/><text x="128" y="352" class="muted body">Approved, applied</text><circle cx="108" cy="388" r="6" class="red"/><text x="128" y="394" class="muted body">Rejected, failed</text>
  <rect x="430" y="210" width="560" height="510" rx="8" class="panel"/><text x="464" y="254" class="txt h2">Evidence Surface</text><text x="464" y="304" class="muted body">Payload diff viewer, tool call summary, risk chips, policy warnings</text><text x="464" y="346" class="muted body">Code/diff local horizontal scroll; audit trail selectable IDs</text><text x="464" y="388" class="muted body">Loading, refresh, conflict, optimistic rollback states</text>
  <rect x="1020" y="210" width="330" height="510" rx="8" class="panel"/><text x="1054" y="254" class="txt h2">Decision Rail</text><text x="1054" y="304" class="muted body">Approve confirmation</text><text x="1054" y="346" class="muted body">Reject note modal</text><text x="1054" y="388" class="muted body">Disabled approve reason</text><text x="1054" y="430" class="muted body">Retry failed apply</text>
  <rect x="70" y="770" width="1280" height="92" rx="8" class="panel"/><text x="104" y="825" class="muted body">Governance: policy table and exception drawer. Evaluation: run selector, scorecards, failure table. Tab S7 stacks queue, evidence and rail.</text>
</svg>
