<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">ContextHub Operations Feature Atlas</title>
  <desc id="desc">Product Design and Stitch summary board for overview, monitoring, runtime, logs, jobs and performance feature specifications.</desc>
  <style>.bg{fill:#0c1322}.panel{fill:#151c28;stroke:#2a3545}.sub{fill:#1b2432;stroke:#2a3545}.txt{fill:#f8fafc;font-family:Inter,Segoe UI,Arial,sans-serif}.muted{fill:#9aa7b8;font-family:Inter,Segoe UI,Arial,sans-serif}.h1{font-size:34px;font-weight:700}.h2{font-size:21px;font-weight:650}.body{font-size:16px}.blue{fill:#0b63ce}.green{fill:#0e9f6e}.amber{fill:#b7791f}.red{fill:#c81e1e}</style>
  <rect class="bg" width="1440" height="960"/><rect x="48" y="44" width="1344" height="116" rx="8" class="panel"/>
  <text x="76" y="92" class="txt h1">Operations Feature Atlas</text><text x="76" y="128" class="muted body">Stitch: projects/4533056430393435785/screens/8950c9e0f9a14b93ac4bf5b7283e6f90</text>
  <rect x="76" y="204" width="388" height="250" rx="8" class="panel"/><text x="108" y="248" class="txt h2">/ and /monitoring</text><text x="108" y="294" class="muted body">Health, snapshot freshness, alerts</text><text x="108" y="334" class="muted body">Time range, refresh cadence, metric detail</text><circle cx="110" cy="382" r="6" class="amber"/><text x="130" y="388" class="muted body">Stale data blocks misleading actions</text>
  <rect x="524" y="204" width="388" height="250" rx="8" class="panel"/><text x="556" y="248" class="txt h2">/runtime and /logs</text><text x="556" y="294" class="muted body">Service cards, dependency map, redaction</text><text x="556" y="334" class="muted body">Query bar, severity filters, live tail</text><circle cx="558" cy="382" r="6" class="blue"/><text x="578" y="388" class="muted body">Log table owns horizontal scroll</text>
  <rect x="972" y="204" width="388" height="250" rx="8" class="panel"/><text x="1004" y="248" class="txt h2">/jobs and /performance</text><text x="1004" y="294" class="muted body">Jobs table, detail drawer, retry/cancel</text><text x="1004" y="334" class="muted body">Probe form, responsive chart, payload block</text><circle cx="1006" cy="382" r="6" class="red"/><text x="1026" y="388" class="muted body">Cancel requires confirmation</text>
  <rect x="76" y="520" width="612" height="250" rx="8" class="panel"/><text x="108" y="564" class="txt h2">Loading and Refresh</text><rect x="108" y="596" width="420" height="12" rx="6" class="sub"/><rect x="108" y="596" width="188" height="12" rx="6" class="blue"/><text x="108" y="646" class="muted body">Panel skeletons, table skeleton rows, client-local last updated, paused/stale chips</text>
  <rect x="748" y="520" width="612" height="250" rx="8" class="panel"/><text x="780" y="564" class="txt h2">RWD and Scroll</text><text x="780" y="610" class="muted body">Desktop drawers; Tab S7 stacked detail panels</text><text x="780" y="650" class="muted body">No double scrollbar; no body horizontal overflow</text><text x="780" y="690" class="muted body">Code, payload and log cells remain selectable</text>
</svg>
