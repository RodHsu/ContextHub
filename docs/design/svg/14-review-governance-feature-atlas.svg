<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">ContextHub Review and Governance Feature Atlas</title>
  <desc id="desc">Product Design and Stitch summary board for inbox, governance, evaluation and ChatGPT proposal review specifications.</desc>
  <style>.bg{fill:#0c1322}.panel{fill:#151c28;stroke:#2a3545}.sub{fill:#1b2432;stroke:#2a3545}.txt{fill:#f8fafc;font-family:Inter,Segoe UI,Arial,sans-serif}.muted{fill:#9aa7b8;font-family:Inter,Segoe UI,Arial,sans-serif}.h1{font-size:34px;font-weight:700}.h2{font-size:21px;font-weight:650}.body{font-size:16px}.blue{fill:#0b63ce}.green{fill:#0e9f6e}.amber{fill:#b7791f}.red{fill:#c81e1e}</style>
  <rect class="bg" width="1440" height="960"/><rect x="48" y="44" width="1344" height="116" rx="8" class="panel"/>
  <text x="76" y="92" class="txt h1">Review and Governance Feature Atlas</text><text x="76" y="128" class="muted body">Stitch: projects/4533056430393435785/screens/f296315d38f5483b8845d1352d75d3c5</text>
  <rect x="76" y="204" width="388" height="250" rx="8" class="panel"/><text x="108" y="248" class="txt h2">/inbox</text><text x="108" y="294" class="muted body">Triage queue, preview pane, batch progress</text><text x="108" y="334" class="muted body">Pending never looks processed</text><circle cx="110" cy="382" r="6" class="blue"/><text x="130" y="388" class="muted body">Undo where safe</text>
  <rect x="524" y="204" width="388" height="250" rx="8" class="panel"/><text x="556" y="248" class="txt h2">/governance and /evaluation</text><text x="556" y="294" class="muted body">Policy table, exception drawer, approvals</text><text x="556" y="334" class="muted body">Scorecards, failure table, regression diff</text><circle cx="558" cy="382" r="6" class="amber"/><text x="578" y="388" class="muted body">Warnings block unsafe actions</text>
  <rect x="972" y="204" width="388" height="250" rx="8" class="panel"/><text x="1004" y="248" class="txt h2">/chatgpt-proposals</text><text x="1004" y="294" class="muted body">Proposal queue, review surface, decision rail</text><text x="1004" y="334" class="muted body">JSON, errors, applied resource and audit trail</text><circle cx="1006" cy="382" r="6" class="red"/><text x="1026" y="388" class="muted body">Approve/reject require note/confirmation</text>
  <rect x="76" y="520" width="612" height="250" rx="8" class="panel"/><text x="108" y="564" class="txt h2">Proof Before Action</text><text x="108" y="610" class="muted body">Pending, validating, approved, rejected, applied, failed, stale and blocked are visually distinct</text><text x="108" y="650" class="muted body">OAuth subject, actor and local timestamps are visible; secrets are never exposed</text>
  <rect x="748" y="520" width="612" height="250" rx="8" class="panel"/><text x="780" y="564" class="txt h2">Responsive Review Surface</text><text x="780" y="610" class="muted body">Desktop 3-column workbench; Tab S7 stacks queue, review and decision rail</text><text x="780" y="650" class="muted body">Tables, JSON and diffs own local horizontal scroll</text>
</svg>
