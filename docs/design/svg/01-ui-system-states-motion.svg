<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">ContextHub UI System, State Model, Motion and Safety Controls</title>
  <desc id="desc">Product Design and Stitch summary board for global UI system states, loading, refresh, motion and safety controls.</desc>
  <style>.bg{fill:#0c1322}.panel{fill:#151c28;stroke:#2a3545;stroke-width:1}.sub{fill:#1b2432;stroke:#2a3545;stroke-width:1}.txt{fill:#f8fafc;font-family:Inter,Segoe UI,Arial,sans-serif}.muted{fill:#9aa7b8;font-family:Inter,Segoe UI,Arial,sans-serif}.h1{font-size:34px;font-weight:700}.h2{font-size:21px;font-weight:650}.body{font-size:16px}.small{font-size:13px}.blue{fill:#0b63ce}.green{fill:#0e9f6e}.amber{fill:#b7791f}.red{fill:#c81e1e}</style>
  <rect class="bg" width="1440" height="960"/>
  <rect x="48" y="44" width="1344" height="112" rx="8" class="panel"/>
  <text x="76" y="92" class="txt h1">UI System, State Model, Motion and Safety Controls</text>
  <text x="76" y="128" class="muted body">Stitch: projects/4533056430393435785/screens/d6284134138544659d04b026954d010f</text>
  <rect x="48" y="190" width="420" height="310" rx="8" class="panel"/>
  <text x="76" y="230" class="txt h2">Core Components</text>
  <text x="76" y="270" class="muted body">Surfaces L0-L2, Inter typography, 4px grid</text>
  <text x="76" y="306" class="muted body">Buttons, forms, drawers, modals, tooltips</text>
  <text x="76" y="342" class="muted body">Refined dot chips, command palette, toasts</text>
  <text x="76" y="378" class="muted body">Selectable: IDs, JSON, code, copied values only</text>
  <rect x="510" y="190" width="420" height="310" rx="8" class="panel"/>
  <text x="538" y="230" class="txt h2">Loading and Refresh</text>
  <rect x="538" y="264" width="330" height="12" rx="6" class="sub"/><rect x="538" y="264" width="126" height="12" rx="6" class="blue"/>
  <text x="538" y="310" class="muted body">App top progress, panel skeleton, table skeleton</text>
  <text x="538" y="346" class="muted body">Live refresh pulse, paused refresh, stale banner</text>
  <text x="538" y="382" class="muted body">Retry flow with request/correlation id</text>
  <rect x="972" y="190" width="420" height="310" rx="8" class="panel"/>
  <text x="1000" y="230" class="txt h2">Safety Controls</text>
  <circle cx="1010" cy="270" r="6" class="red"/><text x="1028" y="276" class="muted body">Destructive confirmation and audit trail</text>
  <circle cx="1010" cy="312" r="6" class="amber"/><text x="1028" y="318" class="muted body">Disabled actions explain reason</text>
  <circle cx="1010" cy="354" r="6" class="green"/><text x="1028" y="360" class="muted body">Pending never looks applied</text>
  <circle cx="1010" cy="396" r="6" class="blue"/><text x="1028" y="402" class="muted body">Client-local timestamps by default</text>
  <rect x="48" y="540" width="646" height="260" rx="8" class="panel"/>
  <text x="76" y="580" class="txt h2">Motion Tokens</text>
  <text x="76" y="624" class="muted body">Hover/focus 120ms; menu/popover 180ms; drawer 220ms; route transition 240ms</text>
  <text x="76" y="664" class="muted body">Live-tail row highlight fades over 700ms; reduced-motion uses fade/snap</text>
  <text x="76" y="704" class="muted body">No decorative animation; motion communicates state, continuity and causality</text>
  <rect x="746" y="540" width="646" height="260" rx="8" class="panel"/>
  <text x="774" y="580" class="txt h2">Layout Guardrails</text>
  <text x="774" y="624" class="muted body">No body horizontal scroll; local table/code/diff horizontal scroll only</text>
  <text x="774" y="664" class="muted body">No nested vertical scrollbar in normal reading flow</text>
  <text x="774" y="704" class="muted body">Panels, drawers and popovers must not overlap data frames</text>
</svg>
