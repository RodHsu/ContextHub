<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">ContextHub Auth and Boundary Pages</title>
  <desc id="desc">Product Design and Stitch summary board for login, forbidden, not-found and error pages.</desc>
  <style>.bg{fill:#0c1322}.panel{fill:#151c28;stroke:#2a3545}.sub{fill:#1b2432;stroke:#2a3545}.txt{fill:#f8fafc;font-family:Inter,Segoe UI,Arial,sans-serif}.muted{fill:#9aa7b8;font-family:Inter,Segoe UI,Arial,sans-serif}.h1{font-size:34px;font-weight:700}.h2{font-size:21px;font-weight:650}.body{font-size:16px}.blue{fill:#0b63ce}</style>
  <rect class="bg" width="1440" height="960"/><rect x="48" y="44" width="1344" height="112" rx="8" class="panel"/>
  <text x="76" y="92" class="txt h1">Auth and Boundary Pages</text><text x="76" y="128" class="muted body">Stitch: projects/4533056430393435785/screens/11e2b475d8b541db953b6fd6b2b710ce</text>
  <rect x="80" y="210" width="600" height="240" rx="8" class="panel"/><text x="112" y="254" class="txt h2">/login</text><text x="112" y="300" class="muted body">OIDC status, redirect loading, disabled login reason</text><text x="112" y="340" class="muted body">Session expired toast; no secrets in diagnostics</text>
  <rect x="760" y="210" width="600" height="240" rx="8" class="panel"/><text x="792" y="254" class="txt h2">/forbidden</text><text x="792" y="300" class="muted body">Permission reason, request access action, audit id</text><text x="792" y="340" class="muted body">Action disabled state explains missing scope</text>
  <rect x="80" y="520" width="600" height="240" rx="8" class="panel"/><text x="112" y="564" class="txt h2">/not-found</text><text x="112" y="610" class="muted body">Route recovery, search, recent valid destinations</text><text x="112" y="650" class="muted body">No decorative hero; operational recovery path</text>
  <rect x="760" y="520" width="600" height="240" rx="8" class="panel"/><text x="792" y="564" class="txt h2">/Error</text><text x="792" y="610" class="muted body">Correlation id, retry, copy diagnostics, client-local time</text><text x="792" y="650" class="muted body">IDs selectable; chrome non-selectable</text>
</svg>
