<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">ContextHub Product Design Strategy and Reference Synthesis</title>
  <desc id="desc">Repo-saved SVG summary board derived from the Stitch product design strategy screen.</desc>
  <defs>
    <style>
      .bg { fill: #111827; }
      .panel { fill: #151c28; stroke: #2a3545; stroke-width: 1; }
      .panel2 { fill: #1b2432; stroke: #2a3545; stroke-width: 1; }
      .ink { fill: #f8fafc; font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .muted { fill: #9aa7b8; font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .tiny { font-size: 13px; }
      .small { font-size: 15px; }
      .body { font-size: 17px; }
      .h2 { font-size: 24px; font-weight: 650; }
      .h1 { font-size: 38px; font-weight: 700; }
      .blue { fill: #0b63ce; }
      .green { fill: #0e9f6e; }
      .amber { fill: #b7791f; }
      .red { fill: #c81e1e; }
      .purple { fill: #6b46c1; }
      .chip { fill: #101827; stroke: #2a3545; stroke-width: 1; }
      .line { stroke: #2a3545; stroke-width: 1; }
      .dash { stroke: #2a3545; stroke-width: 1; stroke-dasharray: 6 6; }
    </style>
  </defs>
  <rect class="bg" width="1440" height="960"/>
  <rect x="48" y="44" width="1344" height="116" rx="10" class="panel"/>
  <text x="76" y="94" class="ink h1">ContextHub 2026 Product Operations Console</text>
  <text x="76" y="132" class="muted body">Product Design + Stitch strategy screen: projects/4533056430393435785/screens/27112231d8494e448ad6e7fdf42eed86</text>
  <rect x="1124" y="72" width="222" height="44" rx="22" class="chip"/>
  <circle cx="1150" cy="94" r="6" class="blue"/>
  <text x="1166" y="100" class="ink small">Modern product surface</text>

  <rect x="48" y="190" width="410" height="296" rx="8" class="panel"/>
  <text x="76" y="230" class="ink h2">Reference Synthesis</text>
  <line x1="76" y1="250" x2="430" y2="250" class="line"/>
  <circle cx="86" cy="286" r="6" class="blue"/>
  <text x="106" y="292" class="ink body">shadcn-admin</text>
  <text x="106" y="318" class="muted small">Responsive app shell, sidebar, command search</text>
  <circle cx="86" cy="358" r="6" class="green"/>
  <text x="106" y="364" class="ink body">Tabler</text>
  <text x="106" y="390" class="muted small">Clean dashboard UI kit, responsive hierarchy</text>
  <circle cx="86" cy="430" r="6" class="amber"/>
  <text x="106" y="436" class="ink body">TailAdmin / Flowbite</text>
  <text x="106" y="462" class="muted small">Tables, forms, CRUD, drawers, auth states</text>

  <rect x="486" y="190" width="410" height="296" rx="8" class="panel"/>
  <text x="514" y="230" class="ink h2">ContextHub Jobs To Be Done</text>
  <line x1="514" y1="250" x2="868" y2="250" class="line"/>
  <rect x="514" y="276" width="354" height="44" rx="8" class="panel2"/>
  <text x="536" y="304" class="ink small">Know if the system is healthy right now</text>
  <rect x="514" y="336" width="354" height="44" rx="8" class="panel2"/>
  <text x="536" y="364" class="ink small">Review AI writes with evidence and control</text>
  <rect x="514" y="396" width="354" height="44" rx="8" class="panel2"/>
  <text x="536" y="424" class="ink small">Diagnose logs, jobs, memory and runtime safely</text>

  <rect x="924" y="190" width="468" height="296" rx="8" class="panel"/>
  <text x="952" y="230" class="ink h2">Observability Reference</text>
  <line x1="952" y1="250" x2="1364" y2="250" class="line"/>
  <text x="952" y="292" class="ink body">Grafana / OpenObserve style density</text>
  <text x="952" y="326" class="muted small">Unify monitoring, runtime, logs, jobs and performance.</text>
  <text x="952" y="360" class="muted small">Use query surfaces, result tables, status chips and alerts.</text>
  <rect x="952" y="398" width="382" height="52" rx="8" class="panel2"/>
  <circle cx="978" cy="424" r="7" class="red"/>
  <text x="1000" y="430" class="ink small">Incident scanning beats decorative dashboard cards</text>

  <rect x="48" y="524" width="262" height="334" rx="8" class="panel"/>
  <text x="76" y="562" class="ink h2">IA Groups</text>
  <line x1="76" y1="582" x2="282" y2="582" class="line"/>
  <text x="76" y="622" class="ink small">Operations Monitoring</text>
  <text x="76" y="656" class="ink small">Knowledge Work</text>
  <text x="76" y="690" class="ink small">Review and Governance</text>
  <text x="76" y="724" class="ink small">Admin Settings</text>
  <text x="76" y="758" class="ink small">Personal Account</text>
  <text x="76" y="810" class="muted tiny">Tablet: 64px icon rail</text>
  <text x="76" y="834" class="muted tiny">Mobile: overlay drawer</text>

  <rect x="338" y="524" width="510" height="334" rx="8" class="panel"/>
  <text x="366" y="562" class="ink h2">Route-Level Experience</text>
  <line x1="366" y1="582" x2="820" y2="582" class="line"/>
  <rect x="366" y="612" width="210" height="82" rx="8" class="panel2"/>
  <text x="388" y="644" class="ink small">Operations</text>
  <text x="388" y="670" class="muted tiny">Metrics + query + results + drawer</text>
  <rect x="604" y="612" width="210" height="82" rx="8" class="panel2"/>
  <text x="626" y="644" class="ink small">Knowledge Work</text>
  <text x="626" y="670" class="muted tiny">Browse + inspect + provenance</text>
  <rect x="366" y="720" width="210" height="82" rx="8" class="panel2"/>
  <text x="388" y="752" class="ink small">ChatGPT Review</text>
  <text x="388" y="778" class="muted tiny">Queue + evidence + decision rail</text>
  <rect x="604" y="720" width="210" height="82" rx="8" class="panel2"/>
  <text x="626" y="752" class="ink small">Admin / Account</text>
  <text x="626" y="778" class="muted tiny">Settings + token safety + audit</text>

  <rect x="876" y="524" width="516" height="334" rx="8" class="panel"/>
  <text x="904" y="562" class="ink h2">Non-Negotiable UX Rules</text>
  <line x1="904" y1="582" x2="1364" y2="582" class="line"/>
  <circle cx="916" cy="624" r="5" class="blue"/>
  <text x="934" y="630" class="ink small">No body horizontal scroll; tables own horizontal overflow.</text>
  <circle cx="916" cy="666" r="5" class="green"/>
  <text x="934" y="672" class="ink small">No nested vertical scrollbars in normal reading flow.</text>
  <circle cx="916" cy="708" r="5" class="amber"/>
  <text x="934" y="714" class="ink small">Disabled and destructive actions explain risk and reason.</text>
  <circle cx="916" cy="750" r="5" class="purple"/>
  <text x="934" y="756" class="ink small">All timestamps render client-local unless UTC is explicit.</text>
  <circle cx="916" cy="792" r="5" class="red"/>
  <text x="934" y="798" class="ink small">Panels, drawers and popovers must not overlap data frames.</text>

  <line x1="253" y1="486" x2="253" y2="524" class="dash"/>
  <line x1="691" y1="486" x2="593" y2="524" class="dash"/>
  <line x1="1158" y1="486" x2="1134" y2="524" class="dash"/>
  <text x="48" y="916" class="muted tiny">SVG is a repo-saved summary board derived from Stitch output; it is not a native Stitch SVG export.</text>
</svg>
