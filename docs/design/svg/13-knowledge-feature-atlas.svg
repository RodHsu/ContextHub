<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">ContextHub Knowledge Feature Atlas</title>
  <desc id="desc">Product Design and Stitch summary board for graph, memories, retention and sources feature specifications.</desc>
  <style>.bg{fill:#0c1322}.panel{fill:#151c28;stroke:#2a3545}.sub{fill:#1b2432;stroke:#2a3545}.txt{fill:#f8fafc;font-family:Inter,Segoe UI,Arial,sans-serif}.muted{fill:#9aa7b8;font-family:Inter,Segoe UI,Arial,sans-serif}.h1{font-size:34px;font-weight:700}.h2{font-size:21px;font-weight:650}.body{font-size:16px}.blue{fill:#0b63ce}.green{fill:#0e9f6e}.amber{fill:#b7791f}.red{fill:#c81e1e}</style>
  <rect class="bg" width="1440" height="960"/><rect x="48" y="44" width="1344" height="116" rx="8" class="panel"/>
  <text x="76" y="92" class="txt h1">Knowledge Feature Atlas</text><text x="76" y="128" class="muted body">Stitch: projects/4533056430393435785/screens/79ba882411d44e13b94cfc6d1de72013</text>
  <rect x="76" y="204" width="388" height="250" rx="8" class="panel"/><text x="108" y="248" class="txt h2">/graph</text><text x="108" y="294" class="muted body">Filter rail, graph canvas, zoom controls</text><text x="108" y="334" class="muted body">Node inspector offsets canvas; stacks on tablet</text><circle cx="110" cy="382" r="6" class="amber"/><text x="130" y="388" class="muted body">Reindex is gated and audited</text>
  <rect x="524" y="204" width="388" height="250" rx="8" class="panel"/><text x="556" y="248" class="txt h2">/memories</text><text x="556" y="294" class="muted body">Search filters, dense table, detail drawer</text><text x="556" y="334" class="muted body">JSON payload, links and chunks are selectable</text><circle cx="558" cy="382" r="6" class="red"/><text x="578" y="388" class="muted body">Delete/archive requires confirmation</text>
  <rect x="972" y="204" width="388" height="250" rx="8" class="panel"/><text x="1004" y="248" class="txt h2">/retention and /sources</text><text x="1004" y="294" class="muted body">Preview before delete apply</text><text x="1004" y="334" class="muted body">Source sync diagnostics with request id</text><circle cx="1006" cy="382" r="6" class="green"/><text x="1026" y="388" class="muted body">Credential status redacted</text>
  <rect x="76" y="520" width="612" height="250" rx="8" class="panel"/><text x="108" y="564" class="txt h2">Graph-Table-Detail Contract</text><text x="108" y="610" class="muted body">Filters stay compact; selected item opens inspector/detail panel</text><text x="108" y="650" class="muted body">No panel overlap; no clipping; no body horizontal scroll</text>
  <rect x="748" y="520" width="612" height="250" rx="8" class="panel"/><text x="780" y="564" class="txt h2">State and Motion</text><text x="780" y="610" class="muted body">No drawable nodes, filter empty, stale index states</text><text x="780" y="650" class="muted body">Reduced motion avoids graph pan and zoom animation</text>
</svg>
