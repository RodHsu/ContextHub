<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">ContextHub Operations Overview and Monitoring</title>
  <desc id="desc">Product Design and Stitch summary board for root dashboard and monitoring route.</desc>
  <style>.bg{fill:#0c1322}.panel{fill:#151c28;stroke:#2a3545}.sub{fill:#1b2432;stroke:#2a3545}.txt{fill:#f8fafc;font-family:Inter,Segoe UI,Arial,sans-serif}.muted{fill:#9aa7b8;font-family:Inter,Segoe UI,Arial,sans-serif}.h1{font-size:34px;font-weight:700}.h2{font-size:21px;font-weight:650}.body{font-size:16px}.green{fill:#0e9f6e}.amber{fill:#b7791f}.red{fill:#c81e1e}.blue{fill:#0b63ce}</style>
  <rect class="bg" width="1440" height="960"/><rect x="48" y="44" width="1344" height="112" rx="8" class="panel"/>
  <text x="76" y="92" class="txt h1">Operations Overview and Monitoring</text><text x="76" y="128" class="muted body">Stitch: projects/4533056430393435785/screens/454b419a89264cc29d07e005029bda83</text>
  <rect x="70" y="204" width="300" height="170" rx="8" class="panel"/><circle cx="104" cy="250" r="7" class="green"/><text x="124" y="256" class="txt h2">Health Summary</text><text x="104" y="302" class="muted body">MCP, embeddings, DB, Redis</text>
  <rect x="410" y="204" width="300" height="170" rx="8" class="panel"/><circle cx="444" cy="250" r="7" class="amber"/><text x="464" y="256" class="txt h2">Snapshot Freshness</text><text x="444" y="302" class="muted body">Stale banner blocks misleading actions</text>
  <rect x="750" y="204" width="300" height="170" rx="8" class="panel"/><circle cx="784" cy="250" r="7" class="blue"/><text x="804" y="256" class="txt h2">Token Savings</text><text x="784" y="302" class="muted body">Compact metrics and local timestamp</text>
