<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">ContextHub Runtime, Logs, Jobs and Performance Workbench</title>
  <desc id="desc">Product Design and Stitch summary board for runtime, logs, jobs and performance routes.</desc>
  <style>.bg{fill:#0c1322}.panel{fill:#151c28;stroke:#2a3545}.sub{fill:#1b2432;stroke:#2a3545}.txt{fill:#f8fafc;font-family:Inter,Segoe UI,Arial,sans-serif}.muted{fill:#9aa7b8;font-family:Inter,Segoe UI,Arial,sans-serif}.h1{font-size:34px;font-weight:700}.h2{font-size:21px;font-weight:650}.body{font-size:16px}.mono{font-family:Consolas,monospace;fill:#cbd5e1;font-size:14px}</style>
  <rect class="bg" width="1440" height="960"/><rect x="48" y="44" width="1344" height="112" rx="8" class="panel"/>
  <text x="76" y="92" class="txt h1">Runtime, Logs, Jobs and Performance Workbench</text><text x="76" y="128" class="muted body">Stitch: projects/4533056430393435785/screens/80b6642ae1b249b3ab921d3ab67129e8</text>
  <rect x="76" y="208" width="600" height="250" rx="8" class="panel"/><text x="108" y="252" class="txt h2">Runtime and Logs</text><text x="108" y="300" class="muted body">Dependency map, service cards, query bar, severity filter, live tail</text><text x="108" y="342" class="mono">2026-07-08 16:20 local | ERR | request failed ...</text><text x="108" y="384" class="muted body">Log/code cells use local horizontal scroll and copy line action</text>
  <rect x="740" y="208" width="620" height="250" rx="8" class="panel"/><text x="772" y="252" class="txt h2">Jobs Queue</text><text x="772" y="300" class="muted body">Job ID, type, state, created local time, retry/cancel gated actions</text><text x="772" y="342" class="muted body">Selected row opens detail drawer; Tab S7 stacks drawer below table</text>
  <rect x="76" y="520" width="600" height="250" rx="8" class="panel"/><text x="108" y="564" class="txt h2">Performance Probe</text><text x="108" y="610" class="muted body">Validated form, measurement chart, payload/code block, failed retry</text>
  <rect x="740" y="520" width="620" height="250" rx="8" class="panel"/><text x="772" y="564" class="txt h2">States and Motion</text><text x="772" y="610" class="muted body">Live refresh pulse, paused refresh, stale data, no logs, no jobs</text><text x="772" y="650" class="muted body">Row hover 120ms; drawer 220ms; new-row highlight 700ms fade</text>
</svg>
