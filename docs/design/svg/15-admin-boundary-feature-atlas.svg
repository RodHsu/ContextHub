<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">ContextHub Admin Boundary Feature Atlas</title>
  <desc id="desc">Product Design and Stitch summary board for preferences, storage, security, settings, tokens and boundary pages.</desc>
  <style>.bg{fill:#0c1322}.panel{fill:#151c28;stroke:#2a3545}.sub{fill:#1b2432;stroke:#2a3545}.txt{fill:#f8fafc;font-family:Inter,Segoe UI,Arial,sans-serif}.muted{fill:#9aa7b8;font-family:Inter,Segoe UI,Arial,sans-serif}.h1{font-size:34px;font-weight:700}.h2{font-size:21px;font-weight:650}.body{font-size:16px}.blue{fill:#0b63ce}.green{fill:#0e9f6e}.amber{fill:#b7791f}.red{fill:#c81e1e}</style>
  <rect class="bg" width="1440" height="960"/><rect x="48" y="44" width="1344" height="116" rx="8" class="panel"/>
  <text x="76" y="92" class="txt h1">Admin, Account and Boundary Feature Atlas</text><text x="76" y="128" class="muted body">Stitch: projects/4533056430393435785/screens/b80a7c7dbf8f4c2f91151dde97db5a38</text>
  <rect x="76" y="204" width="388" height="250" rx="8" class="panel"/><text x="108" y="248" class="txt h2">/preferences and /settings</text><text x="108" y="294" class="muted body">Forms, validation, dirty save bar</text><text x="108" y="334" class="muted body">High-impact changes require confirmation</text><circle cx="110" cy="382" r="6" class="amber"/><text x="130" y="388" class="muted body">Save bar never overlaps content</text>
  <rect x="524" y="204" width="388" height="250" rx="8" class="panel"/><text x="556" y="248" class="txt h2">/storage and /security</text><text x="556" y="294" class="muted body">Usage cards, connection tests, detail tables</text><text x="556" y="334" class="muted body">Roles matrix, audit log, session controls</text><circle cx="558" cy="382" r="6" class="red"/><text x="578" y="388" class="muted body">Remove user uses typed confirmation</text>
  <rect x="972" y="204" width="388" height="250" rx="8" class="panel"/><text x="1004" y="248" class="txt h2">/account/tokens and boundary</text><text x="1004" y="294" class="muted body">Token list, create modal, one-time reveal</text><text x="1004" y="334" class="muted body">Login, forbidden, not-found, error recovery</text><circle cx="1006" cy="382" r="6" class="green"/><text x="1026" y="388" class="muted body">Diagnostics redacted; IDs selectable</text>
  <rect x="76" y="520" width="612" height="250" rx="8" class="panel"/><text x="108" y="564" class="txt h2">Security and Secret Handling</text><text x="108" y="610" class="muted body">Token secret is shown once only; prefixes and diagnostics remain copyable</text><text x="108" y="650" class="muted body">Permission denied shows request access without leaking protected data</text>
  <rect x="748" y="520" width="612" height="250" rx="8" class="panel"/><text x="780" y="564" class="txt h2">Form and Modal Controls</text><text x="780" y="610" class="muted body">Validation inline, disabled reasons visible, focus trap for modal flows</text><text x="780" y="650" class="muted body">Tablet stacks forms and tables; no horizontal body scroll</text>
</svg>
